{% set name = "slack-sdk" %}
{% set version = "3.45.0" %}
{% set ignore_tests = " --ignore=tests/test_proxy_env_variable_loader.py" %}

package:
  name: {{ name }}-split
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 1ab794452f238b59db0d8a4d346263d65190288add53ec67a05751d8e7402486

build:
  number: 0
  skip: true  # [py<37]

outputs:
  - name: slack-sdk
    script: build_base.bat  # [win]
    script: build_base.sh  # [not win]
    requirements:
      host:
        - pip
        - python
        - setuptools
      run:
        - python
      run_constrained:
        - aiodns >1.0
        - aiohttp >=3.13.5,<4
        - boto3 <=2
        - sqlalchemy >=2.0.49,<3
        - websockets >=9.1,<16
        - websocket-client >=1,<2
    test:
      source_files:
        - tests
      imports:
        - slack_sdk
        - slack_sdk.web
        - slack_sdk.webhook
        - slack_sdk.signature
        - slack_sdk.socket_mode
        - slack_sdk.audit_logs
        - slack_sdk.scim
        - slack_sdk.oauth
        - slack_sdk.models
        - slack_sdk.rtm
        - slack_sdk.rtm_v2
      requires:
        - pip
        - pytest >=7.0.1,<9
        - aiohttp >=3.7.3,<4
        - pytest-asyncio <2
      commands:
        - pip check
        - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
        # ModuleNotFoundError: No module named 'tests'
        # test_rtm_client_never_generate_huge_number_of_event_loops is not supported in Python 3.14+:
        # RuntimeError: There is no current event loop in thread 'MainThread'.
        - pytest tests {{ ignore_tests }} -v  # [py<314]
        - pytest tests {{ ignore_tests }} -v -k "not test_rtm_client_never_generate_huge_number_of_event_loops"  # [py>=314]
  - name: slack_sdk
    requirements:
      host:
        - pip
        - python
        - setuptools
      run:
        - python
        - {{ pin_subpackage(name, min_pin='x.x.x', max_pin='x.x.x') }}
    test:
      imports:
        - slack_sdk
      requires:
        - pip
      commands:
        - pip check
        - python -c "from importlib.metadata import version; assert(version('{{ name.replace('-', '_') }}')=='{{ version }}')"

about:
  home: https://slack.dev
  summary: The Slack API Platform SDK for Python
  description: |
    The Slack platform offers several APIs to build apps.
    Each Slack API delivers part of the capabilities from the platform,
    so that you can pick just those that fit for your needs.
    This SDK offers a corresponding package for each of Slack's APIs.
    They are small and powerful when used independently, and work seamlessly
    when used together, too.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/slackapi/python-slack-sdk
  doc_url: https://slack.dev/python-slack-sdk

extra:
  recipe-maintainers:
    - xylar
    - maresb
